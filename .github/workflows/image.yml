name: Image

# Builds and publishes the web application image, per the estate decision
# "build on the node, publish to GHCR, deploy by digest" (apg-infra standards.md):
# the heavy install and build happen on the node runner, and the push uses the job's
# own short-lived GITHUB_TOKEN — no long-lived registry credential on any host.
#
# A pull request only builds (validating the Dockerfile); merging to main publishes
# and prints the digest, which is what `container.json` pins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    runs-on: [self-hosted, apg-ci-04]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with the job token
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report the digest
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in container.json, then run the digest deploy." >> "$GITHUB_STEP_SUMMARY"
