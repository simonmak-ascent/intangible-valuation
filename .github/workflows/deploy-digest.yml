name: deploy-digest

# Deploy one or more containers on one node, by digest, in a single job.
#
# Why a list: three containers across three nodes used to mean nine queued jobs
# fighting for three runners — queue wait reached 4m44s while each job only ran
# 20-35 s. One job per node fixes that: the node pulls once, then swaps each
# container while the runner is already warm.
#
#   gh workflow run deploy-digest.yml -f containers=iv-api,iv-mcp -f digest=sha256:… -f runner=apg-ecs-01
#
# Port, uid, health and command come from container.json, so the declaration
# stays the single source of truth. Nothing is removed until the image is on
# disk and the env file is readable, and a probe container answers before the
# live one is replaced (OI-46).

on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Container names from container.json, comma separated"
        required: true
        type: string
      docker_names:
        description: "Names on the node, comma separated in the same order (default: manifest names)"
        required: false
        type: string
      digest:
        description: "Image digest, e.g. sha256:f3625924…"
        required: true
        type: string
      runner:
        description: "Runner label on the target node"
        required: true
        type: choice
        options: [apg-ecs-01, apg-ecs-02, apg-ecs-03]

permissions:
  contents: read
  packages: read

# The same container on the same node is never deployed twice at once; a second
# dispatch waits instead of racing the first into `docker rm`.
concurrency:
  group: deploy-${{ inputs.runner }}-${{ inputs.containers }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and deploy each container
        env:
          CONTAINERS: ${{ inputs.containers }}
          DOCKER_NAMES: ${{ inputs.docker_names }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -eu
          ref="ghcr.io/${{ github.repository }}@$DIGEST"

          # one pull for the image, not one per container: they share it
          for attempt in 1 2 3; do
            if docker pull "$ref"; then break; fi
            echo "pull attempt $attempt failed; retrying in 10s" >&2
            sleep 10
            [ "$attempt" = 3 ] && exit 1
          done

          names="${DOCKER_NAMES:-$CONTAINERS}"
          IFS=',' read -r -a mans <<< "$CONTAINERS"
          IFS=',' read -r -a dns  <<< "$names"

          for i in "${!mans[@]}"; do
            man="${mans[$i]}"; name="${dns[$i]:-${mans[$i]}}"
            spec=$(python3 - "$man" <<'PY'
import json, sys
name = sys.argv[1]
d = json.load(open("container.json"))
items = d.get("containers", [d])
s = next((c for c in items if c.get("name") == name), None)
if s is None:
    raise SystemExit(f"no container named {name} in container.json")
h = s.get("health") or {}
print(json.dumps({
    "port": s["port"],
    "proto": h.get("proto", "http"),
    "path": h.get("path", "/"),
    "host": h.get("host", ""),
    "envfile": (s.get("run") or {}).get("envFile", ""),
    "cmd": s.get("cmd") or [],
}))
PY
)
            port=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["port"])' "$spec")
            proto=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["proto"])' "$spec")
            path=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["path"])' "$spec")
            vhost=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["host"])' "$spec")
            envf=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["envfile"])' "$spec")
            mapfile -t cmd < <(python3 -c 'import json,sys;[print(a) for a in json.loads(sys.argv[1])["cmd"]]' "$spec")

            # pre-flight: nothing is removed until these hold
            docker image inspect "$ref" >/dev/null
            if [ -n "$envf" ] && [ ! -r "$envf" ]; then
              echo "env file $envf is not readable by $(id -un)" >&2; exit 1
            fi

            opts=(--restart unless-stopped -e NODE_ENV=production -e "PORT=$port")
            [ -n "$envf" ] && opts+=(--env-file "$envf")

            # probe on a spare port, so a bad command never takes the live one down
            docker rm -f "$name.probe" >/dev/null 2>&1 || true
            docker run -d --name "$name.probe" "${opts[@]}" -p "127.0.0.1:$((port+10000)):$port" \
              "$ref" ${cmd[@]+"${cmd[@]}"} >/dev/null
            ok=0
            for _ in 1 2 3 4 5 6 7 8; do
              if [ "$proto" = tcp ] && [ "$(docker inspect "$name.probe" -f '{{.State.Status}}')" = running ]; then ok=1; break; fi
              if [ "$proto" != tcp ] && [ "$(curl -sS -m 3 -o /dev/null -w '%{http_code}' -H "Host: ${vhost:-localhost}" "http://127.0.0.1:$((port+10000))$path" || true)" = 200 ]; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "probe for $name did not come up; live container untouched" >&2
              docker logs --tail 30 "$name.probe" >&2 || true
              docker rm -f "$name.probe" >/dev/null 2>&1 || true
              exit 1
            fi
            docker rm -f "$name.probe" >/dev/null 2>&1

            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" "${opts[@]}" -p "0.0.0.0:$port:$port" \
              "$ref" ${cmd[@]+"${cmd[@]}"} >/dev/null

            for _ in 1 2 3 4 5; do
              [ "$(docker inspect "$name" -f '{{.State.Status}}')" = running ] && break
              sleep 1
            done
            echo "$name: $(docker inspect "$name" -f '{{.State.Status}}') $(docker inspect "$name" -f '{{.Config.Image}}' | sed 's|.*@||' | cut -c1-19)"
          done

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
