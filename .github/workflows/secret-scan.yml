name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # The action downloads its own binary into the runner tool cache and
        # fails with "parameter 'file' is required" when that cache is shared.
        # gitleaks is installed on the runner image, so call it directly.
        run: gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
