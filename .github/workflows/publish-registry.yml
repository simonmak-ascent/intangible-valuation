name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate server.json
        run: mcp-publisher validate

      # A release fires this workflow and the PyPI publish at the same time. The registry
      # rejects a package whose version is not yet on PyPI, so wait for the declared version
      # (and its mcp-name ownership marker) before publishing.
      - name: Wait for PyPI to serve the package version and ownership marker
        run: python3 scripts/wait_for_pypi.py --manifest server.json

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish to registry
        run: |
          # mcp-publisher fails with a 400 "cannot publish duplicate version" when the
          # version in server.json is already registered. Treat that as an idempotent
          # re-run (matching the PyPI workflow's skip-existing behaviour) instead of a
          # hard failure, so a re-dispatch of an already-published release is green.
          set +e
          output=$(mcp-publisher publish 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$output" | grep -q "cannot publish duplicate version"; then
            echo "::notice::Version already published — treating as success (idempotent re-run)."
            exit 0
          fi
          exit "$status"
