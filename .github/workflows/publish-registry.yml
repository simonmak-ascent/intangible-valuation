name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate server.json
        run: mcp-publisher validate

      # A release fires this workflow and the PyPI publish at the same time. The registry
      # rejects a package whose version is not yet on PyPI, so wait for the declared version
      # (and its mcp-name ownership marker) before publishing.
      - name: Wait for PyPI to serve the package version and ownership marker
        run: python3 scripts/wait_for_pypi.py --manifest server.json

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish to registry
        run: mcp-publisher publish
