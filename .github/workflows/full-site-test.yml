name: Full-Site Regression Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests-webapp/e2e/full-site.spec.ts"
      - "lib/valuation/catalog.ts"

jobs:
  full-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run full-site regression against production
        run: npx playwright test tests-webapp/e2e/full-site.spec.ts --project=chromium --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: https://intangible-valuation.ascent-partners.com
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-site-test-log
          path: /tmp/test*.log
          if-no-files-found: warn
