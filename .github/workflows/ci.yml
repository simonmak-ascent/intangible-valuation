name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check (MCP surface & tooling)
        run: ruff format --check mcp_server/tool_surface.py scripts/generate_mcp.py api/mcp.py

      - name: Type check with mypy
        run: mypy src/

      - name: MCP surface determinism gate
        run: |
          python scripts/generate_mcp.py
          git diff --exit-code -- mcp_server/server.py || (echo "mcp_server/server.py is out of date; run 'python scripts/generate_mcp.py'." && exit 1)

      - name: Run pytest with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Enforce coverage threshold
        run: coverage report --fail-under=85

      - name: Verify build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
