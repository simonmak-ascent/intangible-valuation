name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, apg-ci-04]
    # A hung job otherwise inherits the 6-hour default: a `next build` once sat 31 minutes at 0% CPU
    # waiting on Google Fonts, and `gh pr checks --watch` waits it out. This suite takes under 2.
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # setuptools is pinned upward because the 3.11 toolbox ships 79.0.1, which carries three
          # advisories: PYSEC-2026-3447 (twice) is fixed at 83.0.0 and GHSA-xmj3-9gf7-h52w at 84.1.0,
          # so the floor is the higher of the two. Upgrading here rather than before the audit keeps
          # one environment — the first run of the audit gate is what found this.
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[dev,mcp]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check (MCP surface & tooling)
        run: ruff format --check mcp_server/tool_surface.py scripts/generate_mcp.py api/mcp.py

      - name: Type check with mypy
        run: mypy src/

      - name: MCP surface determinism gate
        run: |
          python scripts/generate_mcp.py
          git diff --exit-code -- mcp_server/server.py || (echo "mcp_server/server.py is out of date; run 'python scripts/generate_mcp.py'." && exit 1)

      - name: Run pytest with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Enforce coverage threshold
        run: coverage report --fail-under=85

      # The npm half of this repository has gated on severity since #64; this half had no advisory
      # check at all, and no lockfile either — `pip install -e .` resolves whatever PyPI serves that
      # day, on a self-hosted runner. `--local` audits the interpreter this job just installed into,
      # which is the environment the tests ran against, so it needs no separate resolver.
      # Deliberately after the test run: installing pip-audit must not perturb the environment pytest used.
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          # Pinned: this runs on the self-hosted control node, and an unpinned install executes a
          # version nobody reviewed. 2.10.1 is the one measured against this tree.
          python -m pip install --quiet "pip-audit==2.10.1"
          pip-audit --local

      - name: Verify build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
