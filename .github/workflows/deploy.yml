name: Deploy Canary

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  canary:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deploy
        run: |
          echo "Waiting up to 10 minutes for the production deploy to become healthy..."
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://intangible-valuation.simonmak.com/ || echo "000")
            if [ "$code" = "200" ]; then
              echo "Home 200 after ${i}x15s"
              exit 0
            fi
            echo "attempt $i: home returned $code — waiting 15s"
            sleep 15
          done
          echo "Timed out waiting for production deploy"
          exit 1

      - name: Hosted MCP endpoint health (14 tools)
        run: |
          body=$(curl -sf https://intangible-valuation.simonmak.com/api/mcp)
          echo "$body"
          echo "$body" | grep -q '"tools": 14' || (echo "MCP endpoint did not report 14 tools" && exit 1)

      - name: Hosted MCP end-to-end (tools/call)
        run: |
          body=$(curl -sf -X POST https://intangible-valuation.simonmak.com/api/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"valuation_time_value","arguments":{"method":"present_value","future_value":1000000,"discount_rate":0.10,"periods":5}}}')
          echo "$body"
          echo "$body" | grep -q '"value"' || (echo "MCP tools/call canary failed: no value in response" && exit 1)
