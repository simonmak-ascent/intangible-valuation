name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, apg-ci-04]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same constraints as the image's docs stage (Dockerfile.web), so this workflow builds the
          # site that ships rather than a differently-resolved one.
          python -m pip install -c constraints-docs.txt -e ".[docs]"

      - name: Build docs
        run: python -m mkdocs build --strict
