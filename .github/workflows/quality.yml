name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  webapp-quality:
    runs-on: [self-hosted, apg-ci-04]
    # Takes ~2.5 minutes. 30 catches the recorded failure mode — a `next build` waiting on Google
    # Fonts at 0% CPU for 31 minutes — while leaving room for a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The check that would have caught GHSA-mw96-cpmx-2vgc before it sat on the default branch for
      # a release cycle. `--audit-level=high` fails only on high or critical, so the dev-scope
      # moderates do not block a merge: most need a Sentry major, but two @vitest/mocker advisories
      # clear at 4.1.12 (inside the declared ^4.1.11) and the minimatch ones are patched at 11.0.1.
      # Do not add `continue-on-error` here to quiet it — that is how the high advisory survived.
      # It needs registry egress; a network failure fails the job rather than passing silently.
      - name: Audit for high or critical vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests + content audit
        run: pnpm run test

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm run build

      - name: Accessibility + published-page E2E
        run: pnpm exec playwright test tests-webapp/e2e/a11y.spec.ts tests-webapp/e2e/compliance.spec.ts --project=chromium
